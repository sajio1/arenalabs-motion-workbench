[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greenwich-motion-pipelines"
version = "0.1.0"
description = "Unified full-body, four-endpoint and wheeled-upper-body Greenwich pipelines"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
runtime = ["torch>=2.1", "mujoco>=3.2", "h5py>=3.10", "trimesh", "platformdirs", "transformers", "huggingface-hub", "safetensors", "opencv-python", "Pillow", "imageio-ffmpeg"]
test = ["pytest>=7"]

[project.scripts]
greenwich-pipelines = "greenwich_pipelines.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
alphamotion = ["assets/**/*"]
"greenwich_pipelines.pipelines.nymeria" = ["official/nymeriaplus/loaders/xsens.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
