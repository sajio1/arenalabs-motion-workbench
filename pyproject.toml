[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greenwich-motion-pipelines"
version = "0.1.0"
description = "Multimodal human-to-robot motion generation and workbench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
runtime = ["torch>=2.1", "mujoco>=3.2", "h5py>=3.10", "trimesh", "platformdirs", "transformers", "huggingface-hub", "safetensors", "sentencepiece", "protobuf", "opencv-python", "Pillow>=10.3", "imageio-ffmpeg"]
test = ["pytest>=7", "httpx>=0.27"]
dataset = ["pyarrow>=17", "pandas>=2", "trimesh", "opencv-python", "fastapi>=0.115", "python-multipart>=0.0.18"]
geometry = ["zarr>=2.18,<3", "numcodecs>=0.12,<0.16", "pyarrow>=17", "opencv-python", "imageio", "imageio-ffmpeg"]
viewer = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.18", "mujoco>=3.2", "trimesh", "imageio-ffmpeg"]

[project.scripts]
arena-workbench = "arenalab_workbench.serve_workbench:main"
greenwich-pipelines = "greenwich_pipelines.cli:main"
greenwich-motion-lab = "greenwich_pipelines.viewer.server:main"

[tool.setuptools]
license-files = ["NOTICE.md", "third_party/licenses/EGOALLO_LICENSE", "third_party/fullbody-sdk/NOTICE.md", "third_party/nymeriaplus/LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
alphamotion = ["assets/**/*"]
"greenwich_pipelines.pipelines.nymeria" = ["official/nymeriaplus/loaders/xsens.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
